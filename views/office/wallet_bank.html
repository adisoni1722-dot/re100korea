<script>
  // --- 설정 변수 ---
  const withdrawalFee = 500;
  const minWithdrawalAmount = 10000;
  const POINT_TO_KRW_RATE = 1;

  // --- DOM 요소 ---
  const withdrawalForm = document.getElementById('withdrawal-form');
  const bankSelect = document.getElementById('bank_name');
  const accountHolderInput = document.getElementById('account_holder');
  const accountNumberInput = document.getElementById('account_number');
  const contactNumberInput = document.getElementById('contact_number');
  const amountInput = document.getElementById('amount');

  const amountDisplay = document.getElementById('amount-display');
  const feeDisplay = document.getElementById('fee-display');
  const totalDisplay = document.getElementById('total-display');

  // --- 유틸리티 ---
  function formatNumber(number) {
    return number.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  }

  function updateSummary() {
    let amount = parseInt(amountInput.value, 10) || 0;
    let currentFee = amount >= minWithdrawalAmount ? withdrawalFee : 0;
    let finalDeposit = (amount - currentFee) * POINT_TO_KRW_RATE;
    if (finalDeposit < 0) finalDeposit = 0;

    amountDisplay.textContent = formatNumber(amount) + ' P';
    feeDisplay.textContent = formatNumber(currentFee) + ' P';
    totalDisplay.textContent = formatNumber(finalDeposit) + ' 원';
  }

  // --- 이벤트 바인딩 ---
  amountInput.addEventListener('input', updateSummary);


  withdrawalForm.addEventListener('submit', function(event) {
    event.preventDefault();

    const bank = bankSelect.value.trim();
    const holder = accountHolderInput.value.trim();
    const account = accountNumberInput.value.trim();
    const contact = contactNumberInput.value.trim();
    const amount = parseInt(amountInput.value, 10) || 0;
    const totalDeducted = amount + (amount >= minWithdrawalAmount ? withdrawalFee : 0);

    if (bank === '') {
      alert('입금 은행을 선택해주세요.');
      bankSelect.focus();
      return;
    }
    if (holder === '') {
      alert('예금주명을 입력해주세요.');
      accountHolderInput.focus();
      return;
    }
    if (account === '') {
      alert('계좌번호를 입력해주세요.');
      accountNumberInput.focus();
      return;
    }
    if (contact === '') {
      alert('연락처를 입력해주세요.');
      contactNumberInput.focus();
      return;
    }
    if (amount < minWithdrawalAmount) {
      alert(`최소 인출 금액은 ${formatNumber(minWithdrawalAmount)} P 입니다.`);
      amountInput.focus();
      return;
    }
    if (totalDeducted > userTotalPoints) {
      alert('보유 포인트가 부족합니다. (수수료 포함)');
      amountInput.focus();
      return;
    }

    console.log('폼 검증 통과. 서버로 인출 요청 데이터를 전송합니다.');
    withdrawalForm.submit();
  });

  // 초기 요약 표
  updateSummary();
</script>
