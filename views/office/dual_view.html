<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마이오피스</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

/* ===== 기본 레이아웃 (데스크톱 기준: 좌우 배치) ===== */
.dual-layout {
  display: flex;
  width: 100%;
  height: 100vh;
  flex-direction: row;
}

.left-frame {
  flex: 7;
  border: none;
  height: 100%;
}

.right-frame {
  flex: 3;
  border: none;
  height: 100%;
  background-color: #fff;
  border-left: 1px solid #ddd;
}

/* ===== 1400px 이하에서는 left-frame 숨김 ===== */
@media (max-width: 1100px) {
  .left-frame {
    display: none !important;  /* ✅ 강제 숨김 */
    width: 0 !important;
    flex: 0 0 0 !important;
  }

  .right-frame {
    flex: 1 1 100% !important;
    width: 100% !important;
    border-left: none !important;
  }
}
</style>
</head>
<body>
<div class="dual-layout">
  <iframe src="/office/line/sponsor/<?=$id?>" class="left-frame" name="orgFrame"></iframe>
  <iframe src="/office/bonus/list/<?=$id?>" class="right-frame" name="pointFrame"></iframe>
</div>
</body>
</html>
