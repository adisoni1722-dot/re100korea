    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.querySelector('.search-input');
            const tabs = document.querySelectorAll('.tab-item');
            const pointList = document.querySelector('.point-list');

            function getPointItems() {
                return pointList.querySelectorAll('.point-item');
            }

            let currentFilter = 'all';

            function filterItems() {
                const searchTerm = searchInput.value.toLowerCase();
                const pointItems = getPointItems();

                pointItems.forEach((item) => {
                    const description = item.querySelector('.description').textContent.toLowerCase();
                    const isPlus = item.querySelector('.points.plus');
                    const isMinus = item.querySelector('.points.minus');

                    let tabMatch = false;
                    if (currentFilter === 'all') {
                        tabMatch = true;
                    } else if (currentFilter === 'plus' && isPlus) {
                        tabMatch = true;
                    } else if (currentFilter === 'minus' && isMinus) {
                        tabMatch = true;
                    }

                    const searchMatch = description.includes(searchTerm);

                    if (tabMatch && searchMatch) {
                        item.style.display = 'flex';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            tabs.forEach((tab) => {
                tab.addEventListener('click', () => {
                    tabs.forEach((t) => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    filterItems();
                });
            });

            searchInput.addEventListener('input', filterItems);

            filterItems();
        });
    </script>
