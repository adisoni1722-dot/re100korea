<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>알람 설정 (확장형)</title>
    <style>
        /* 페이지 전용 변수 재정의 */
        :root {
            --primary: rgb(138, 0, 252); 
            --white: #ffffff;
            --text-primary: #212529;
            --text-secondary: #868e96;
            --border-color: #dee2e6;
            --bg-light: #f5f7f8;
            --point-color: #212121;
        }

        /* 폰트 및 기본 설정 */
        body {
            font-family: 'Malgun Gothic', 'Dotum', 'Apple SD Gothic Neo', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--white); /* 전체 배경 흰색으로 변경 */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        
        /* ---------------- 설정 페이지 컨테이너 (화면 꽉 채움) ---------------- */
        .setting-container {
            width: 100%;
            max-width: 900px; /* 넓게 확장 */
            min-height: 90vh; /* 높이를 화면에 가깝게 확장 */
            margin: 0;
            background-color: var(--white);
            box-sizing: border-box;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        /* 헤더/제목 스타일 */
        .setting-header {
            padding: 30px 40px;
            border-bottom: 2px solid #e0e0e0; /* 제목과 본문 구분 명확히 */
            background-color: var(--white);
        }

        .setting-header h2 {
            font-size: 32px; /* 제목 크기 강조 */
            font-weight: 700;
            color: var(--point-color);
            margin: 0;
        }

        .setting-header p {
            font-size: 18px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* ---------------- 설정 리스트 섹션 ---------------- */
        .setting-group {
            padding: 40px 40px 60px; /* 상하좌우 여백 크게 */
        }

        .setting-list {
            list-style: none;
            padding: 0;
            margin: 0;
            /* 네이버 앱처럼 그룹 전체에 테두리를 두르지 않고 항목별로 구분 */
        }

        /* 리스트 항목 (크게 강조) */
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 0; /* 상하 패딩을 크게 늘려 공간 확보 */
            border-bottom: 1px solid #ebebeb; /* 얇은 구분선 */
        }

        .setting-item:first-child {
            border-top: 1px solid #ebebeb; /* 첫 항목 상단에도 구분선 추가 */
        }

        .setting-item-text {
            font-size: 20px; /* 폰트 크기 강조 */
            color: var(--text-primary);
            font-weight: 500;
            line-height: 1.5;
            flex-grow: 1;
        }
        
        .setting-item-desc {
            display: block;
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 4px;
        }

        /* ---------------- 토글 스위치 (ON/OFF) 스타일 (크기 조정) ---------------- */
        .switch {
            position: relative;
            display: inline-block;
            width: 56px; /* 크기 확대 */
            height: 32px; /* 크기 확대 */
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 32px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 24px; /* 크기 확대 */
            width: 24px; /* 크기 확대 */
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(24px); /* 이동 거리 조정 */
        }

        /* ==============================================
         * 모바일 환경 (768px 이하) 반응형 스타일
         * ============================================== */
        @media (max-width: 768px) {
            
            .setting-header {
                padding: 20px;
            }
            .setting-header h2 {
                font-size: 26px;
            }
            .setting-header p {
                font-size: 16px;
            }

            .setting-group {
                padding: 20px;
            }
            
            .setting-item {
                padding: 20px 0;
            }

            .setting-item-text {
                font-size: 18px; /* 모바일 폰트 크기 조정 */
            }
            .setting-item-desc {
                font-size: 14px;
            }
        }

        @media (max-width: 480px) {
            .setting-header h2 {
                font-size: 22px;
            }
            .setting-header p {
                font-size: 14px;
            }
            .setting-item-text {
                font-size: 16px;
            }
            .setting-item-desc {
                font-size: 13px;
            }
            /* 스위치 크기는 유지하여 터치 용이성 확보 */
        }
    </style>
</head>
<body>

    <div class="setting-container">
        
        <div class="setting-header">
            <h2>알림 설정</h2>
            <p>필수적인 알림을 관리하고 편리하게 정보를 받아보세요.</p>
        </div>

        <div class="setting-group">
            <ul class="setting-list">
                <li class="setting-item">
                    <span class="setting-item-text">
                        문자 메시지 수신 알림
                        <span class="setting-item-desc">새로운 문자가 도착했을 때 알림을 받습니다. (필수)</span>
                    </span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </li>
                
                <li class="setting-item">
                    <span class="setting-item-text">
                        일일 수당 지급 알림
                        <span class="setting-item-desc">정산이 완료되면 수당 지급 내역을 즉시 알려드립니다.</span>
                    </span>
                    <label class="switch">
                        <input type="checkbox" checked>
                        <span class="slider"></span>
                    </label>
                </li>
                
                <li class="setting-item">
                    <span class="setting-item-text">
                        신규 라인 등록 알림
                        <span class="setting-item-desc">나의 라인에 새로운 멤버가 등록될 때 알림을 받습니다.</span>
                    </span>
                    <label class="switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                </li>
            </ul>
        </div>
    </div>

</body>
</html>
