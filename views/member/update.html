<div id="custom-modal-overlay" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.35);z-index:9999;">
  <div id="custom-modal" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:32px 28px 24px 28px;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.18);min-width:260px;text-align:center;">
    <div id="custom-modal-message" style="font-size:18px;color:#222;margin-bottom:24px;"></div>
    <button id="custom-modal-btn" style="padding:8px 32px;background:#333;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;">확인</button>
  </div>
</div>
<script>
function showModalPopup(msg, onConfirm) {
    const overlay = document.getElementById('custom-modal-overlay');
    const modalMsg = document.getElementById('custom-modal-message');
    const modalBtn = document.getElementById('custom-modal-btn');
    if (overlay && modalMsg && modalBtn) {
        modalMsg.textContent = msg;
        overlay.style.display = 'block';
        modalBtn.onclick = function() {
            overlay.style.display = 'none';
            if (typeof onConfirm === 'function') onConfirm();
        };
    }
}

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('update-form');
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('password_confirm');
    const phoneInput = document.getElementById('phone');
    const passwordCheckMsg = document.getElementById('password_check_msg');
    const passwordConfirmMsg = document.getElementById('password_confirm_msg');
    const phoneCheckMsg = document.getElementById('phone_check_msg');

    // 비밀번호 유효성 검사 함수 (최소 6자리, 영문+숫자 포함)
    const validatePassword = (password) => {
        const regex = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{6,}$/;
        return regex.test(password);
    };

    // 한국 휴대폰 번호 유효성 검사 함수
    const validatePhone = (phone) => {
        const regex = /^01([0|1|6|7|8|9])-?([0-9]{3,4})-?([0-9]{4})$/;
        return regex.test(phone);
    };

    // 비밀번호 실시간 유효성 검사 핸들러
    const handlePasswordValidation = () => {
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;

        if (password) {
            if (validatePassword(password)) {
                passwordCheckMsg.textContent = '사용 가능한 비밀번호입니다.';
                passwordCheckMsg.style.color = 'green';
            } else {
                passwordCheckMsg.textContent = '비밀번호는 6자 이상, 영문과 숫자를 포함해야 합니다.';
                passwordCheckMsg.style.color = 'red';
            }
        } else {
            passwordCheckMsg.textContent = '비밀번호를 변경하려면 6자 이상(영문+숫자) 입력해주세요.';
            passwordCheckMsg.style.color = '';
        }

        if (passwordConfirm) {
            if (password === passwordConfirm) {
                passwordConfirmMsg.textContent = '비밀번호가 일치합니다.';
                passwordConfirmMsg.style.color = 'green';
            } else {
                passwordConfirmMsg.textContent = '비밀번호가 일치하지 않습니다.';
                passwordConfirmMsg.style.color = 'red';
            }
        } else {
            passwordConfirmMsg.textContent = '';
        }
    };

    // 휴대폰 번호 실시간 유효성 검사 핸들러
    const handlePhoneValidation = () => {
        const phone = phoneInput.value;
        if (phone) {
            if (validatePhone(phone)) {
                phoneCheckMsg.textContent = '올바른 휴대폰 번호 형식입니다.';
                phoneCheckMsg.style.color = 'green';
            } else {
                phoneCheckMsg.textContent = '올바르지 않은 휴대폰 번호 형식입니다.';
                phoneCheckMsg.style.color = 'red';
            }
        } else {
            phoneCheckMsg.textContent = '휴대폰 번호 입력은 선택사항 입니다.';
            phoneCheckMsg.style.color = '';
        }
    };

    // 각 입력 필드에 이벤트 리스너 추가
    passwordInput.addEventListener('input', handlePasswordValidation);
    passwordConfirmInput.addEventListener('input', handlePasswordValidation);
    phoneInput.addEventListener('input', handlePhoneValidation);

    // 폼 제출 시 AJAX로 전송
    form.addEventListener('submit', function(event) {
        event.preventDefault();
        const password = passwordInput.value;
        const passwordConfirm = passwordConfirmInput.value;
        const phone = phoneInput.value;

        // 기존 유효성 검사
        if (password) {
            if (!validatePassword(password)) {
                alert('비밀번호는 6자 이상, 영문과 숫자를 포함해야 합니다.');
                passwordInput.focus();
                return;
            }
            if (password !== passwordConfirm) {
                alert('비밀번호가 일치하지 않습니다.');
                passwordConfirmInput.focus();
                return;
            }
        }
        if (phone && !validatePhone(phone)) {
            alert('올바른 휴대폰 번호 형식을 입력해주세요.');
            phoneInput.focus();
            return;
        }

        // AJAX 전송
        const formData = new FormData(form);
        fetch(form.action, {
            method: 'POST',
            body: formData,
        })
        .then(response => response.text())
        .then(data => {
            if (data.includes('정보가 수정 되었습니다')) {
                showModalPopup('정보가 수정 되었습니다', function() {
                    if(window.parent && window.parent.closeModal){
                        window.parent.closeModal();
                    }
                });
            } else {
                showModalPopup(data);
            }
        })
        .catch(error => {
            alert('오류가 발생했습니다.');
        });
    });
});
</script>
