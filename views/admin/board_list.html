<script>
    // 전체 선택/해제 스크립트
    function check_all(f) {
        var chk = document.getElementsByName("chk[]");
        for (i = 0; i < chk.length; i++)
            chk[i].checked = f.chkall.checked;
    }

    // 폼 전송 시 유효성 검사
    document.getElementById('fboardlist').addEventListener('submit', function(e) {
        var chk = document.getElementsByName("chk[]");
        var bchk = false;
        for (i = 0; i < chk.length; i++) {
            if (chk[i].checked) bchk = true;
        }
        if (!bchk) {
            alert("수정할 게시판을 하나 이상 선택하세요.");
            e.preventDefault();
            return;
        }
    });
</script>
