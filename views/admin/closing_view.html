<script>
    document.addEventListener("DOMContentLoaded", () => {
        // --- 테이블 검색 필터 ---
        const searchInput = document.getElementById('payoutSearch');
        const tableBody = document.getElementById('payoutTableBody');
        const rows = tableBody.querySelectorAll('tr');

        if (searchInput) {
            searchInput.addEventListener('input', () => {
                const q = searchInput.value.toLowerCase();
                rows.forEach(row => {
                    const name = row.querySelector('.user-info')?.textContent.toLowerCase() || '';
                    const id = row.querySelector('.user-id')?.textContent.toLowerCase() || '';
                    row.style.display = (name.includes(q) || id.includes(q)) ? '' : 'none';
                });
            });
        }
    });
</script>
