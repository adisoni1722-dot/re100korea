<script>
  document.addEventListener('DOMContentLoaded', () => {
    // --- 이미지 처리 스크립트 ---
    const existingImages = [
      "<?= isset($product['image_main']) ? $product['image_main'] : '' ?>",
      "<?= isset($product['image_sub1']) ? $product['image_sub1'] : '' ?>",
      "<?= isset($product['image_sub2']) ? $product['image_sub2'] : '' ?>",
      "<?= isset($product['image_sub3']) ? $product['image_sub3'] : '' ?>",
      "<?= isset($product['image_detail']) ? $product['image_detail'] : '' ?>",
    ];

    const containers = document.querySelectorAll('.image-upload-container');
    const form = document.getElementById('productForm');

    containers.forEach((container, index) => {
      const imagePreview = container.querySelector('.recipient-avatar');
      const fileInput = container.querySelector('.image-upload-input');
      const removeButton = container.querySelector('.remove-image-button');

      if (existingImages[index]) {
        imagePreview.src = existingImages[index];
        imagePreview.classList.add('visible');
        container.classList.add('has-image');
      }

      container.addEventListener('click', (e) => {
        if (e.target.closest('.remove-image-button')) return;
        if (!container.classList.contains('has-image')) {
          fileInput.click();
        }
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function(e) {
            imagePreview.src = e.target.result;
            imagePreview.classList.add('visible');
            container.classList.add('has-image');
          };
          reader.readAsDataURL(file);
        }
      });
    });

    function removeImageUI(container) {
      const imagePreview = container.querySelector('.recipient-avatar');
      const fileInput = container.querySelector('.image-upload-input');
      imagePreview.src = '';
      imagePreview.classList.remove('visible');
      container.classList.remove('has-image');
      fileInput.value = null;
    }

    form.addEventListener('submit', function(event) {
      const productName = document.querySelector('input[name="name"]').value.trim();
      const productSlogan = document.querySelector('input[name="slogan"]').value.trim();
      const productPrice = document.querySelector('input[name="price"]').value.trim();
      const productdisPrice = document.querySelector('input[name="discount_price"]').value.trim();

      if (productName === '') {
        window.alert('상품명을 입력해주세요.');
        document.querySelector('input[name="name"]').focus();
        event.preventDefault();
        return;
      }
      if (productSlogan === '') {
        window.alert('슬로건을 입력해주세요.');
        document.querySelector('input[name="slogan"]').focus();
        event.preventDefault();
        return;
      }
      if (productPrice === '' || isNaN(productPrice)) {
        window.alert('시중가 가격을 입력해주세요.');
        document.querySelector('input[name="price"]').focus();
        event.preventDefault();
        return;
      }

      if (productdisPrice === '' || isNaN(productdisPrice)) {
        window.alert('딜러가 가격을 입력해주세요.');
        document.querySelector('input[name="discount_price"]').focus();
        event.preventDefault();
        return;
      }
    });

    const csrfTokenName = '<?= csrf_token_name(); ?>';
    const csrfTokenInput = document.getElementById('csrf_token');
    let csrfHash = csrfTokenInput ? csrfTokenInput.value : '';

    document.querySelectorAll('.remove-image-button').forEach((button) => {
      button.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        const field = this.dataset.field;
        const productId = this.dataset.productId;
        const container = this.closest('.image-upload-container');

        if (!productId) {
          // 새 상품 등록 시 (product_id가 없음)
          removeImageUI(container);
          return;
        }

        Modal.confirm('이미지를 삭제하시겠습니까? [복구불가]', () => {
          const currentTokenInput = document.querySelector(`input[name="${csrfTokenName}"]`);
          const currentToken = currentTokenInput ? currentTokenInput.value : csrfHash;

          fetch('/admin/product/delete_image', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              [csrfTokenName]: csrfHash,
              body: JSON.stringify({
                product_id: productId,
                field: field,
                [csrfTokenName]: currentToken,
              }),
            })
            .then((res) => res.json())
            .then((data) => {
              if (data[csrfTokenName]) {
                csrfHash = data[csrfTokenName];
                if (csrfTokenInput) {
                  csrfTokenInput.value = csrfHash; // id로 찾아서 갱신
                }
              }
              if (data.success) {
                removeImageUI(container);
              } else {
                Modal.alert('삭제 실패: ' + data.message);
              }
            })
            .catch((error) => {
              console.error('Request failed:', error);
              Modal.alert('요청 처리 중 오류가 발생했습니다.');
            });
        });
      });
    });
  });
</script>
