<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleGroups = document.querySelectorAll('.btn-toggle-group');
        toggleGroups.forEach(group => {
            group.addEventListener('click', (e) => {
                const clickedButton = e.target.closest('.btn-toggle');
                if (!clickedButton) return;
                group.querySelectorAll('.btn-toggle').forEach(btn => btn.classList.remove('active'));
                clickedButton.classList.add('active');
                const targetId = group.dataset.target;
                const targetInput = document.getElementById(targetId);
                if (targetInput) targetInput.value = clickedButton.dataset.value;
            });
        });

        // 삭제 버튼 로직 (삭제 버튼이 있을 때만 동작)
        const deleteBtns = document.querySelectorAll('[data-action]');
        if (deleteBtns.length > 0) {
            deleteBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    if (!document.querySelector('.modal-overlay')) {
                        if (confirm(btn.dataset.message)) location.href = btn.dataset.action;
                    }
                });
            });
        }
    });
</script>
